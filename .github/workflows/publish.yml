name: Publish to npm

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (Linux / Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scheduler

    steps:
      - name: Checkout scheduler
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: scheduler
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is contained in main
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "Tag $GITHUB_REF_NAME points to $TAG_COMMIT, which is not contained in origin/main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scheduler/package-lock.json

      - name: Install scheduler dependencies
        run: npm ci

      - name: Smoke verification
        env:
          SKIP_AGENTCLI_INTEGRATION: '1'
        run: npm run verify:smoke

  agentcli-integration:
    name: Public agentcli ${{ matrix.contract }} compatibility (Ubuntu / Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - contract: handoff-v4
            ref: 484fdaad6dd361b0e45bcafa1d04dcab2357370a
          - contract: handoff-v3
            ref: f1fed6d7d451196bda316b82d6567b174012a4ba
          - contract: handoff-v2
            ref: 317cc0eea8b4c65bc3213f5f329124a45c958bd3
    defaults:
      run:
        working-directory: scheduler

    steps:
      - name: Checkout scheduler
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: scheduler
          persist-credentials: false

      - name: Checkout pinned public agentcli
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: amittell/agentcli
          ref: ${{ matrix.ref }}
          path: agentcli
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scheduler/package-lock.json

      - name: Install scheduler dependencies
        run: npm ci

      - name: Link checked-out agentcli for handoff v4 runtime tests
        if: ${{ matrix.contract == 'handoff-v4' }}
        run: |
          mkdir -p node_modules/@amittell
          ln -s ../../../agentcli node_modules/@amittell/agentcli

      - name: Run required scheduler-agentcli contract checks
        env:
          AGENTCLI_PATH: ${{ github.workspace }}/agentcli
          AGENTCLI_CONTRACT: ${{ matrix.contract }}
        run: npm run test:agentcli

      - name: Verify shared handoff v4 fixture parity
        if: ${{ matrix.contract == 'handoff-v4' }}
        run: cmp fixtures/handoff-v4/conformance.json ../agentcli/fixtures/handoff-v4/conformance.json

  published-agentcli:
    name: Published agentcli 0.4.1 black-box (Ubuntu / Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scheduler

    steps:
      - name: Checkout scheduler
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: scheduler
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scheduler/package-lock.json

      - name: Install scheduler dependencies
        run: npm ci

      - name: Install exact published agentcli package
        run: |
          mkdir -p "$RUNNER_TEMP/agentcli-published"
          cd "$RUNNER_TEMP/agentcli-published"
          npm init -y
          npm install --save-exact --no-audit --no-fund @amittell/agentcli@0.4.1

      - name: Verify published package signatures and provenance
        working-directory: ${{ runner.temp }}/agentcli-published
        run: npm audit signatures --include-attestations

      - name: Run published-package compile, apply, approve, restart, execute, and inspect conformance
        env:
          AGENTCLI_BIN: ${{ runner.temp }}/agentcli-published/node_modules/@amittell/agentcli/bin/agentcli.js
        run: npm run verify:agentcli-published

  publish:
    name: Publish
    needs:
      - verify
      - agentcli-integration
      - published-agentcli
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: scheduler

    steps:
      - name: Checkout scheduler
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: scheduler
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is contained in main
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "Tag $GITHUB_REF_NAME points to $TAG_COMMIT, which is not contained in origin/main"
            exit 1
          fi

      - name: Require successful main CI for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          deadline=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&head_sha=${tag_commit}&per_page=20")"
            status="$(printf '%s' "$run_json" | jq -r '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.run_number) | last | .status // "missing"')"
            conclusion="$(printf '%s' "$run_json" | jq -r '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.run_number) | last | .conclusion // "pending"')"
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              exit 0
            fi
            if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
              echo "Main CI for $tag_commit completed with conclusion $conclusion"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for successful main CI for $tag_commit"
          exit 1

      - name: Checkout pinned public agentcli
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: amittell/agentcli
          ref: 484fdaad6dd361b0e45bcafa1d04dcab2357370a
          path: agentcli
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
          cache-dependency-path: scheduler/package-lock.json

      - name: Install scheduler dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish
        env:
          AGENTCLI_PATH: ${{ github.workspace }}/agentcli
          AGENTCLI_CONTRACT: handoff-v4
        run: npm publish --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
