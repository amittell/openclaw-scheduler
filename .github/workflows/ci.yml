name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Smoke + Tests (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # windows-latest: disabled until test suite path handling is
          # cross-platform. Windows installs use WSL2 (see INSTALL-WINDOWS.md).
        node:
          - '22'
          - '24'
          - '25'
          - '26'

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository verification gate
        env:
          SKIP_AGENTCLI_INTEGRATION: '1'
        run: npm run verify:smoke

  agentcli-integration:
    name: Public agentcli ${{ matrix.contract }} compatibility (Ubuntu / Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - contract: handoff-v3
            ref: 38980ad8f1b8a31bb6757579fc5e0e60c280a718
            stale_v2_assertion: '1'
          - contract: handoff-v2
            ref: 317cc0eea8b4c65bc3213f5f329124a45c958bd3
            stale_v2_assertion: '0'
    defaults:
      run:
        working-directory: scheduler

    steps:
      - name: Checkout scheduler
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: scheduler
          persist-credentials: false

      - name: Checkout pinned public agentcli
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: amittell/agentcli
          ref: ${{ matrix.ref }}
          path: agentcli
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scheduler/package-lock.json

      - name: Install scheduler dependencies
        run: npm ci

      - name: Run required scheduler-agentcli contract checks
        env:
          AGENTCLI_PATH: ${{ github.workspace }}/agentcli
          AGENTCLI_CONTRACT: ${{ matrix.contract }}
          AGENTCLI_STALE_V2_FIELD_ASSERTION: ${{ matrix.stale_v2_assertion }}
        run: npm run test:agentcli

  package:
    name: Published package contract (Ubuntu / Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify extracted npm package and strict consumer types
        run: npm run verify:package
